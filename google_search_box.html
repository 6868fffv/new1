<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Search | Qur'anic Arabic Vocabulary</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #202124;
    }

    .google-search {
      max-width: 600px;
      margin: 25px auto;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .google-search h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .google-search p {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.6;
    }

    .google-search form {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .google-search input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .google-search input:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 2px #e8f0fe;
    }

    .google-search button {
      padding: 12px 16px;
      background: #4285f4;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .google-search button:hover {
      background: #3367d6;
    }

    @media (max-width: 420px) {
      .google-search {
        margin: 16px auto;
        padding: 16px;
      }

      .google-search form {
        gap: 6px;
      }

      .google-search button {
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="google-search">
    <h1>Google Search</h1>
    <p>আরবি শব্দ, বাংলা অর্থ বা কুরআনের আয়াত খুঁজুন</p>

    <form action="https://www.google.com/search" method="get" target="_blank">
      <input
        type="search"
        name="q"
        placeholder="এখানে লিখে সার্চ করুন..."
        aria-label="Google-এ সার্চ করুন"
        required
      >
      <button type="submit">🔍 সার্চ</button>
    </form>
  </main>
</body>
</html>
