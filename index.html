<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search anything on the web with Google.">
  <title>Google Search</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #202124;
      background: #f8f9fa;
    }

    .search-page {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .logo {
      margin: 0 0 12px;
      font-size: clamp(42px, 10vw, 68px);
      font-weight: 600;
      letter-spacing: -3px;
      color: #4285f4;
    }

    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    .subtitle {
      margin: 0 0 28px;
      color: #5f6368;
      font-size: 16px;
      line-height: 1.6;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 8px 7px 18px;
      background: #fff;
      border: 1px solid #dfe1e5;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.12);
    }

    .search-form:focus-within {
      border-color: #b8c7e6;
      box-shadow: 0 2px 10px rgba(60, 64, 67, 0.18);
    }

    .search-icon {
      flex: 0 0 auto;
      color: #70757a;
      font-size: 21px;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      padding: 11px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      font-size: 16px;
    }

    .search-form button {
      flex: 0 0 auto;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: #1a73e8;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .search-form button:hover { background: #1765cc; }

    .hint {
      margin-top: 18px;
      color: #70757a;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 460px) {
      body { padding: 20px 12px; }
      .subtitle { font-size: 14px; margin-bottom: 22px; }
      .search-form { gap: 7px; padding-left: 13px; }
      .search-form button { padding: 11px 13px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="search-page">
    <h1 class="logo" aria-label="Google">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </h1>
    <p class="subtitle">ইন্টারনেটে যেকোনো কিছু খুঁজুন</p>

    <form class="search-form" action="https://www.google.com/search" method="get" target="_blank">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        type="search"
        name="q"
        placeholder="যেকোনো কিছু সার্চ করুন..."
        aria-label="যেকোনো কিছু সার্চ করুন"
        autocomplete="on"
        required
      >
      <button type="submit">Search</button>
    </form>

    <p class="hint">বাংলা · English · العربية · ছবি · ভিডিও · খবর · আরও অনেক কিছু</p>
  </main>
</body>
</html>
